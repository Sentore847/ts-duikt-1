<!DOCTYPE HTML>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Paradigm Shift - TS Demo</title>
	<link rel="stylesheet" href="assets/css/main.css" />
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			background-color: #f8f9fa;
			margin: 0;
			padding: 40px;
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 100vh;
		}

		button {
			background-color: #0d6efd;
			color: #fff;
			border: none;
			padding: 10px 20px;
			border-radius: 5px;
			font-size: 16px;
			cursor: pointer;
			transition: background-color 0.2s ease;
			margin: 10px 0;
		}

		button:hover {
			background-color: #0b5ed7;
		}

		.modal {
			display: none;
			justify-content: center;
			align-items: center;
			position: fixed;
			background: rgba(0, 0, 0, 0.6);
		}

		.modal-content {
			background: #fff;
			padding: 30px;
			max-width: 450px;
			width: 90%;
			border-radius: 10px;
			text-align: center;
			box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
		}

		.modal-content h2 {
			margin-top: 0;
		}

		#posts {
			margin-top: 20px;
			width: 90%;
			max-width: 800px;
			display: flex;
			flex-direction: column;
			gap: 15px;
		}

		.post {
			background: #fff;
			padding: 15px 20px;
			border-radius: 8px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
		}

		.post h3 {
			margin: 0 0 10px 0;
			color: #0d6efd;
		}

		.post p {
			margin: 0;
			color: #333;
		}
	</style>
</head>

<body>
	<button id="openModal">Open Modal</button>

	<div class="modal">
		<div class="modal-content">
			<h2>Modal Window</h2>
			<p>This is a working modal window.</p>
			<button id="closeModal">Close</button>
		</div>
	</div>

	<button id="loadPosts">Load Posts</button>

	<div id="posts"></div>

	<script src="./dist/main.js"></script>
</body>

</html>
